<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; }
    a { color: #16324F; } a:hover { color: #0E2338; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FAF9F7; color: #1A1917; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Header -->
  <div style="padding: 22px 22px 16px 22px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1.1; color: #1A1917;">Request help</div>
      <div style="font-size: 13px; color: #9C978E;">Alpha&#8209;7</div>
    </div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="width: 7px; height: 7px; border-radius: 999px; background: #2E7D4F;"></div>
      <div style="font-size: 13px; color: #6B6862;">Location found, accurate to 4 m</div>
    </div>
  </div>

  <!-- Body -->
  <div style="flex-grow: 1; padding: 0 22px; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">

    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div style="font-size: 15px; font-weight: 500; color: #1A1917;">What do you need?</div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px;">

        <div style="height: 74px; border-radius: 14px; background: #1A1917; display: flex; align-items: center; gap: 12px; padding: 0 16px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"><path d="M12 6v12M6 12h12"></path></svg>
          <div style="font-size: 15px; font-weight: 500; color: #FFFFFF;">Medical</div>
        </div>

        <div style="height: 74px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E3DE; display: flex; align-items: center; gap: 12px; padding: 0 16px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5s6 6.3 6 9.8a6 6 0 0 1-12 0c0-3.5 6-9.8 6-9.8z"></path></svg>
          <div style="font-size: 15px; font-weight: 500; color: #1A1917;">Water</div>
        </div>

        <div style="height: 74px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E3DE; display: flex; align-items: center; gap: 12px; padding: 0 16px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0z"></path><path d="M8 7.5c0-1.6.8-2.6 1.8-3.3M13 7.5c0-1.6.8-2.6 1.8-3.3"></path></svg>
          <div style="font-size: 15px; font-weight: 500; color: #1A1917;">Food</div>
        </div>

        <div style="height: 74px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E3DE; display: flex; align-items: center; gap: 12px; padding: 0 16px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"></path></svg>
          <div style="font-size: 15px; font-weight: 500; color: #1A1917;">Shelter</div>
        </div>

        <div style="height: 74px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E3DE; display: flex; align-items: center; gap: 12px; padding: 0 16px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"></path><path d="M9.5 8l-4 4 4 4"></path><path d="M5.5 12h9"></path></svg>
          <div style="font-size: 15px; font-weight: 500; color: #1A1917;">Rescue</div>
        </div>

        <div style="height: 74px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6E3DE; display: flex; align-items: center; gap: 12px; padding: 0 16px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"></circle><path d="M6 20a6 6 0 0 1 12 0"></path></svg>
          <div style="font-size: 15px; font-weight: 500; color: #1A1917;">Missing</div>
        </div>

      </div>

      <div style="font-size: 14px; color: #9C978E;">Fire and building collapse &rarr;</div>
    </div>

    <!-- Urgency -->
    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div style="font-size: 15px; font-weight: 500; color: #1A1917;">How urgent?</div>
      <div style="display: flex; border-radius: 14px; border: 1px solid #E6E3DE; background: #FFFFFF; overflow: hidden;">
        <div style="flex-grow: 1; height: 62px; background: #D0342C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
          <div style="font-size: 15px; font-weight: 600; color: #FFFFFF;">Now</div>
          <div style="font-size: 11px; color: #F6D3D0;">life at risk</div>
        </div>
        <div style="flex-grow: 1; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-left: 1px solid #E6E3DE;">
          <div style="font-size: 15px; font-weight: 500; color: #1A1917;">Soon</div>
          <div style="font-size: 11px; color: #9C978E;">hours</div>
        </div>
        <div style="flex-grow: 1; height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-left: 1px solid #E6E3DE;">
          <div style="font-size: 15px; font-weight: 500; color: #1A1917;">Can wait</div>
          <div style="font-size: 11px; color: #9C978E;">stable</div>
        </div>
      </div>
    </div>

    <!-- People -->
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="font-size: 15px; font-weight: 500; color: #1A1917; flex-grow: 1;">How many people?</div>
      <div style="display: flex; align-items: center; border-radius: 12px; border: 1px solid #E6E3DE; background: #FFFFFF; overflow: hidden;">
        <div style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6B6862" stroke-width="1.9" stroke-linecap="round"><path d="M6 12h12"></path></svg>
        </div>
        <div style="font-size: 18px; font-weight: 600; color: #1A1917; min-width: 32px; text-align: center;">4</div>
        <div style="width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1A1917" stroke-width="1.9" stroke-linecap="round"><path d="M12 6v12M6 12h12"></path></svg>
        </div>
      </div>
    </div>

  </div>

  <!-- Send -->
  <div style="padding: 16px 22px 26px 22px; display: flex; flex-direction: column; gap: 10px;">
    <div style="height: 60px; border-radius: 16px; background: #D0342C; display: flex; align-items: center; justify-content: center;">
      <div style="font-size: 17px; font-weight: 600; color: #FFFFFF;">Send</div>
    </div>
    <div style="font-size: 13px; color: #9C978E; text-align: center;">Works with no signal. Passes device to device until it reaches help.</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
